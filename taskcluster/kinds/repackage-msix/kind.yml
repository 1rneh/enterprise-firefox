---
loader: taskgraph.loader.transform:loader

transforms:
    - taskgraph.transforms.from_deps
    - gecko_taskgraph.transforms.name_sanity
    - gecko_taskgraph.transforms.repackage
    - gecko_taskgraph.transforms.job
    - gecko_taskgraph.transforms.task

kind-dependencies:
    # We're going to generate tasks based on this.  We `depend` on and fetch the package from this.
    - build-signing
    - toolchain
    - enterprise-repack

only-for-build-platforms:
    - win32/opt
    - win64/opt
    - win64-aarch64/opt
    - win64/debug
    - win32-shippable/opt
    - win64-shippable/opt
    - win64-aarch64-shippable/opt
    - win64-aarch64-enterprise-shippable/opt
    - win32-devedition/opt
    - win64-devedition/opt
    - win64-aarch-devedition/opt

tasks:
    repackage-msix:
        # TODO: disabled for Enterprise repacks
        # from-deps:
        #     group-by: platform
        #     unique-kinds: false
        # copy-repack-ids: true
        from-deps:
            group-by: single-with-filters
        worker-type: b-linux
        worker:
            max-run-time: 2700
        # This is for fast try iteration; `repackage-shippable-l10n-msix` is the "real one".
        run-on-projects: ["enterprise-firefox"]
        mozharness:
            config:
                by-build-platform:
                    win32\b.*:
                        - repackage/base.py
                        - repackage/win32_sfx_stub.py
                        - repackage/win32_signed.py
                    win64(?!-aarch64)\b.*:
                        - repackage/base.py
                        - repackage/win32_sfx_stub.py
                        - repackage/win64_signed.py
                    win64-aarch64\b.*:
                        - repackage/base.py
                        - repackage/win64-aarch64_sfx_stub.py
                        - repackage/win64_signed.py
        package-formats: [msix, msix-store]
        fetches:
            toolchain:
                - linux64-msix-packaging
        msix:
            vendor: Mozilla
            channel:
                by-shipping-product:
                    firefox-enterprise:
                        by-release-type:
                            release-enterprise: release-enterprise
                            beta-enterprise: beta-enterprise
                            nightly-enterprise: nightly-enterprise
                            default: default-enterprise
                    devedition: aurora
                    default:
                        by-release-type:
                            beta.*: beta
                            release: official
                            esr.*: official
                            default: nightly
            identity-name:
                by-shipping-product:
                    firefox-enterprise: "Firefox Enterprise"
                    devedition:
                        by-package-format:
                            msix: MozillaFirefoxDevedition
                            msix-store: FirefoxDevedition
                            default: "MozillaFirefoxDevedition"
                    default:
                        by-package-format:
                            msix:
                                by-release-type:
                                    beta.*: MozillaFirefoxBeta
                                    release: MozillaFirefox
                                    esr.*: MozillaFirefox
                                    default: MozillaFirefoxNightly
                            msix-store:
                                by-release-type:
                                    beta.*: FirefoxBeta
                                    release: Firefox
                                    esr.*: Firefox
                                    default: FirefoxNightly
                            default:
                                by-release-type:
                                    beta.*: MozillaFirefoxBeta
                                    release: MozillaFirefox
                                    esr.*: MozillaFirefox
                                    default: MozillaFirefoxNightly
            publisher:
                by-package-format:
                    msix-store: "CN=082E9164-EE6C-4EC8-B62C-441FAE7BEFA1"
                    msix:
                        by-level:
                            "1": "CN=Mozilla Fake SPC"
                            "2": "CN=Mozilla Fake SPC"
                            default:
                                # This value needs to line up with the signing certificate
                                # we're going to sign with. We only sign potential release
                                # or nightly builds with proper certificates, so even on
                                # level 3 repositories, some build types are expected to
                                # be signed with our fake certificate.
                                by-build-platform:
                                    .*-shippable: "CN=Mozilla Corporation, OU=Firefox Engineering Operations, O=Mozilla Corporation, L=San Francisco, S=California, C=US"
                                    .*-devedition: "CN=Mozilla Corporation, OU=Firefox Engineering Operations, O=Mozilla Corporation, L=San Francisco, S=California, C=US"
                                    default: "CN=Mozilla Fake SPC"
            publisher-display-name:
                by-package-format:
                    msix: "Mozilla Corporation"
                    msix-store: "Mozilla"
